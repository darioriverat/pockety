<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Budgets Verification</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; background: #f4f7f5; color: #1c1917; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    .meta { color: #57534e; margin-bottom: 1.5rem; }
    .summary { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .stat { background: #fff; border: 1px solid #d6d3d1; border-radius: 8px; padding: 1rem 1.25rem; min-width: 140px; }
    .stat strong { display: block; font-size: 0.8rem; color: #78716c; text-transform: uppercase; }
    .stat span { font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #e7e5e4; text-align: left; }
    th { background: #ecfdf5; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr.over { background: #fef2f2; }
    .nav { margin-top: 1.5rem; }
    .nav a { color: #0f766e; }
  </style>
</head>
<body>
  <h1>Budgets</h1>
  <p class="meta">Budget vs Actual verification for period 202501</p>
  <div class="summary">
    <div class="stat" data-testid="budget-total"><strong>Total Budget</strong><span>$800.00</span></div>
    <div class="stat" data-testid="actual-total"><strong>Total Actual</strong><span>$0.00</span></div>
    <div class="stat" data-testid="variance-total"><strong>Variance</strong><span>$-800.00</span></div>
  </div>
  <table data-testid="budget-vs-actual-table">
    <thead>
      <tr>
        <th>Category</th>
        <th>Budget</th>
        <th>Actual</th>
        <th>Variance</th>
        <th>%</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr class="" data-testid="budget-row-C001" data-over-budget="false"><td>C001 MERCADO</td><td>$800.00</td><td>$0.00</td><td>$-800.00</td><td>0.00%</td><td>Under budget</td></tr>
    </tbody>
  </table>
  <p class="nav"><a href="/budgets">Open live Budgets page</a></p>
</body>
</html>
