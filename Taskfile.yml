version: "3"

tasks:
  shell:
    desc: Open a shell in the web container
    cmds:
      - |
        docker exec -it -u appuser \
            -w /var/www/vhosts web_app \
            /bin/bash -l
  shell-root:
    desc: Open a shell in the web container with the root user
    cmds:
      - |
        docker exec -it -u root \
            -w /var/www/vhosts web_app \
            /bin/bash -l
  dev:
    desc: Run the development server in the web container
    cmds:
      - |
        docker exec -it -u appuser \
            -w /var/www/vhosts web_app \
            "npm" "run" "dev"
  backend-tests:
    desc: Execute backend tests
    cmds:
      - |
        docker exec -u appuser \
            -w /var/www/vhosts web_app \
            bash -lc "composer test"
  frontend-tests:
    desc: Execute frontend unit and component tests
    cmds:
      - |
        docker exec -u appuser \
            -w /var/www/vhosts web_app \
            bash -lc "npm run test:unit"
  browser-test-seed:
    desc: Seed browser test data
    cmds:
      - |
        docker exec -u appuser \
            -w /var/www/vhosts web_app \
            bash -lc "php artisan db:seed --class=BrowserTestSeeder"
  browser-test-install:
    desc: Install Playwright browser binaries
    cmds:
      - |
        docker exec -u appuser \
            -w /var/www/vhosts web_app \
            bash -lc "npx playwright install chromium"
  browser-tests:
    desc: Execute Playwright browser tests
    cmds:
      - task: browser-test-install
      - task: browser-test-seed
      - |
        docker exec -u appuser \
            -w /var/www/vhosts web_app \
            bash -lc "PLAYWRIGHT_BASE_URL=http://host.docker.internal:8080 npm run test:browser"
  tests:
    desc: Execute backend and frontend tests
    cmds:
      - task: backend-tests
      - task: frontend-tests
