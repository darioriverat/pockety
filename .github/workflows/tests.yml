name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      # public/build is gitignored, so copy it before upload.
      - name: Stage front-end build
        run: cp -a public/build frontend-build

      - name: Upload front-end build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build
          retention-days: 1

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download front-end build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Install front-end build
        run: |
          manifest="$(find frontend-build -name manifest.json -print -quit)"
          if [ -z "$manifest" ]; then
            echo "Vite manifest was not in the downloaded build"
            find frontend-build -maxdepth 3 -type f
            exit 1
          fi
          rm -rf public/build
          mv "$(dirname "$manifest")" public/build

      - name: Run backend tests
        run: composer test

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit
